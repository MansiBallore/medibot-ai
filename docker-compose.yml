version: "3.9"

services:
  medibot:
    build: .
    container_name: medibot-ai
    ports:
      - "8000:8000"
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB=medibot
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - JWT_SECRET=${JWT_SECRET:-change-me-jwt}
      - DEBUG=false
    volumes:
      - medibot_uploads:/app/uploads
      - medibot_logs:/app/logs
      - medibot_vectorstore:/app/data/vectorstore
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongo:
    image: mongo:7.0
    container_name: medibot-mongo
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Mongo Express admin UI
  mongo-express:
    image: mongo-express:1.0
    container_name: medibot-mongo-ui
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=medibot123
    depends_on:
      - mongo
    restart: unless-stopped
    profiles: ["debug"]

volumes:
  mongo_data:
  medibot_uploads:
  medibot_logs:
  medibot_vectorstore:
